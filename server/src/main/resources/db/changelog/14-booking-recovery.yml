databaseChangeLog:
- changeSet:
    id: 14-booking-recovery
    author: ai-managers
    changes:
    - sql:
        sql: >-
          ALTER TABLE booking_attempt ADD COLUMN start_at BIGINT;
          ALTER TABLE booking_attempt ADD COLUMN end_at BIGINT;
          ALTER TABLE booking_attempt ADD COLUMN clinic_id BIGINT;
          ALTER TABLE booking_attempt ADD COLUMN service_id BIGINT;
          ALTER TABLE booking_attempt ADD COLUMN schedule_id BIGINT;
          ALTER TABLE booking_attempt ADD COLUMN doctor_id BIGINT;
          ALTER TABLE booking_attempt ADD COLUMN telemedicine BOOLEAN;
          ALTER TABLE booking_attempt ADD COLUMN baseline_reservation_ids TEXT;
          ALTER TABLE booking_attempt ADD COLUMN baseline_reservation_facts TEXT;
          ALTER TABLE booking_attempt ADD COLUMN acknowledged_at BIGINT;
          CREATE TABLE booking_attempt_review_audit (
            audit_id BIGSERIAL PRIMARY KEY,
            account_id BIGINT NOT NULL,
            attempt_id VARCHAR(36) NOT NULL,
            fingerprint VARCHAR(64) NOT NULL,
            reservation_id BIGINT NOT NULL,
            start_at BIGINT NOT NULL,
            end_at BIGINT NOT NULL,
            clinic_id BIGINT NOT NULL,
            service_id BIGINT NOT NULL,
            schedule_id BIGINT NOT NULL,
            doctor_id BIGINT NOT NULL,
            telemedicine BOOLEAN NOT NULL,
            baseline_reservation_ids TEXT NOT NULL,
            service_and_doctor_verified BOOLEAN NOT NULL,
            provider_request_settled BOOLEAN NOT NULL,
            reviewed_by VARCHAR(128) NOT NULL,
            reason VARCHAR(1000) NOT NULL,
            reviewed_at BIGINT NOT NULL
          );
          ALTER TABLE cancellation_receipt_review_audit
            ADD COLUMN provider_request_settled BOOLEAN NOT NULL DEFAULT FALSE;
          ALTER TABLE cancellation_receipt_review_audit
            ADD COLUMN cancellation_status_verified BOOLEAN NOT NULL DEFAULT FALSE;
          ALTER TABLE cancellation_receipt ADD COLUMN moved_start_at BIGINT;
          ALTER TABLE cancellation_receipt ADD COLUMN moved_end_at BIGINT;
          ALTER TABLE cancellation_receipt ADD COLUMN moved_clinic_id BIGINT;
          ALTER TABLE cancellation_receipt ADD COLUMN moved_telemedicine BOOLEAN;
          ALTER TABLE cancellation_receipt ADD COLUMN moved_clinic_address VARCHAR(512);
          ALTER TABLE cancellation_receipt ADD COLUMN moved_clinic_city VARCHAR(255);
          ALTER TABLE cancellation_receipt ADD COLUMN moved_acknowledged_at BIGINT;
          ALTER TABLE cancellation_receipt_review_audit ADD COLUMN moved_start_at BIGINT;
          ALTER TABLE cancellation_receipt_review_audit ADD COLUMN moved_end_at BIGINT;
          ALTER TABLE cancellation_receipt_review_audit ADD COLUMN moved_clinic_id BIGINT;
          ALTER TABLE cancellation_receipt_review_audit ADD COLUMN moved_telemedicine BOOLEAN;
          ALTER TABLE cancellation_receipt_review_audit ADD COLUMN moved_clinic_address VARCHAR(512);
          ALTER TABLE cancellation_receipt_review_audit ADD COLUMN moved_clinic_city VARCHAR(255);
          ALTER TABLE cancellation_receipt_review_audit ADD COLUMN moved_acknowledged_at BIGINT;
